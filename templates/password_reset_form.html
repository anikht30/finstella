{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Finstella</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="{% static 'icons/finstellaBrowser.png' %}">
</head>
<body style="background: #F8FAFC; color: #1E293B; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; margin: 0; font-family: 'Inter';">

<div style="width: 100%; max-width: 450px;"> 
    
    <div style="text-align: center; margin-bottom: 32px;">
        <div style="display: flex; justify-content: center; margin-bottom: 16px;">
           <img src="{% static 'finstella.svg' %}" alt="Finstella" style="height: 35px;">
        </div>
        <h1 style="font-family: 'Inter'; font-size: 28px; color: #199A7A; margin-bottom: 8px; margin-top: 0;">Reset Password</h1>
        <p style="font-size: 14px; color: #64748B; line-height: 1.6; margin: 0;">Enter your work email address and we will send you a link to reset your password.</p>
    </div>
    
    <form method="POST" style="background: #ffffff; border: 1px solid rgba(4, 44, 26, 0.08); border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.04);">
        {% csrf_token %}
        
        <!-- Email Input -->
        <div style="margin-bottom: 24px; display: flex; flex-direction: column;">
            <label for="id_email" style="color: #1E293B; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Work Email</label>
            <input type="email" name="email" id="id_email" autocomplete="email" required style="background: #fff; color: #1E293B; border: 1px solid #CBD5E1; padding: 12px 16px; border-radius: 8px; outline: none; font-family: inherit; font-size: 14px; transition: border-color 0.2s;" onfocus="this.style.borderColor='#199A7A'" onblur="this.style.borderColor='#CBD5E1'" />
        </div>

        <button type="submit" style="width: 100%; background: #199A7A; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s, transform 0.1s; font-family: inherit;" onmouseover="this.style.background='#128266'" onmouseout="this.style.background='#199A7A'" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
            Send Reset Link
        </button>
        
        <div style="margin-top: 24px; text-align: center; padding-top: 16px;">
            <a href="{% url 'login' %}" style="font-size: 13px; color: #64748B; text-decoration: none; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#1E293B'" onmouseout="this.style.color='#64748B'">
                ← Return to Login
            </a>
        </div>
    </form>

</div>
</body>
</html>
