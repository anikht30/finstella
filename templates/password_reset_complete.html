{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated — Finstella</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"/>
</head>
<body style="background: #F8FAFC; color: #1E293B; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; margin: 0; font-family: Inter;">

<div style="width: 100%; max-width: 450px; text-align: center;"> 
    
    <div style="background: #ffffff; border: 1px solid rgba(4, 44, 26, 0.08); border-radius: 12px; padding: 40px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.04);">
        
        <!-- Lock Check Icon -->
        <div style="width: 60px; height: 60px; background: #f0fdfa; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#199A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>

        <h1 style="font-family: 'Lora', serif; font-size: 26px; color: #1E293B; margin-bottom: 12px; margin-top: 0;">Password Updated!</h1>
        
        <p style="font-size: 15px; color: #64748B; line-height: 1.6; margin-bottom: 32px;">
            Your password has been successfully changed. You can now use your new password to access your Finstella account.
        </p>
        
        <a href="{% url 'login' %}" style="display: inline-block; width: 100%; background: #199A7A; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s;">
            Sign In Now
        </a>

    </div>

</div>
</body>
</html>
