{% extends "layout.html" %}


{% load static %}

{% block title %} | Topics{%endblock%}



{% block maincontent %}

<!-- Active Discussion div start-->
          <div class="active-discussion-box">

            <div class="active-discussion-title">
                <h4>Topics</h4>
                       <a href="javascript:history.back()" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748B; font-family: inherit; font-weight: 600; font-size: 13px; transition: color 0.2s;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
            </a>

            </div>

            <div style="border: 1px solid #e7e8e9; border-radius: 12px;margin-bottom:10px;padding-top:20px;">
                                                        
           {% for category in categories%}
            
                <div class="category-list" style="border-radius: 12px;padding: 10px 30px;">
        
                 

                  <div class="category-text" style="category-text:before:none;">
                    <a href="{% url 'topic_details' category.id %}" style="text-decoration:none">
                        <h5 style="font-family:inherit; font-weight:500; font-size:12px;color:#000;">
                   {{category.name }} 
                  </h5>
                  </a>

                  <h5 style="font-family:inherit; font-weight:500; font-size:12px;">{{category.total_threads}}</h5>
                 
                  </div>

                
                  </div>
   


           {% endfor %}
                 </div> 

          </div>

          <!-- Active Discussion div end -->


{% endblock %}
