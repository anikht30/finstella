{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Start a Discussion — INFINEETIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: var(--bg);">

<nav>
  <div class="nav-brand">
    <div class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L20 7V17L12 22L4 17V7L12 2Z" stroke="#9FE1CB" stroke-width="1.5" fill="none"/>
        <path d="M12 6L17 9V15L12 18L7 15V9L12 6Z" stroke="#1D9E75" stroke-width="1" fill="none"/>
        <circle cx="12" cy="12" r="2.5" fill="#1D9E75"/>
      </svg>
    </div>
    <div class="nav-wordmark" style="font-size: 24px; color: var(--deep); font-weight: 700; letter-spacing: 1px;">
        <span>INFIN</span><span style="color: var(--teal);">EETIA</span>
    </div>
  </div>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}" class="btn-ghost" style="padding: 6px 14px;">← Cancel</a>
  </div>
</nav>

<section class="cta-section" style="padding-top: 120px; min-height: 100vh; align-items: flex-start;">
  <div class="cta-inner" style="max-width: 700px;">
    <div class="sec-eyebrow" style="justify-content: flex-start;">New Discussion</div>
    <h2 class="sec-h2" style="text-align: left; margin-bottom: 24px;">What's on your mind?</h2>
    
    <div class="cta-form" style="text-align: left;">
      <form method="POST">
        {% csrf_token %}
        
        <div class="fl" style="margin-bottom: 20px;">
          <label>Category</label>
          <select name="category" required>
            <option value="" disabled selected>Select a topic area...</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="fl" style="margin-bottom: 20px;">
          <label>Discussion Title</label>
          <input type="text" name="title" placeholder="e.g., How are you handling the new SEBI guidelines?" required style="font-weight: 600;"/>
        </div>

        <div class="fl" style="margin-bottom: 24px;">
          <label>Context & Details</label>
          <textarea name="content" placeholder="Share your current approach, challenges, or specific questions for the community..." required style="height: 180px;"></textarea>
        </div>
        
        <button type="submit" class="form-submit" style="background: var(--teal);">Post to Community</button>
      </form>
    </div>
  </div>
</section>

</body>
</html>
