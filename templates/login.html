{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finstella | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<!-- Changed background to var(--bg) and text to var(--deep) -->
<body style=" color: var(--deep); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div id="app" style="width: 100%; max-width: 380px; padding: 20px;">
    
    <!-- Branding Header -->
    <div class="auth-hd" style="text-align: center; margin-bottom: 24px;">
        <div style="display: flex; justify-content: center; margin-bottom: 12px;">
        <div class="nav-logo">
            <img src={%static 'finstella.svg'%} alt="">
    </div>
        </div>
        <!-- Changed text color to var(--deep) to match dashboard -->
        <div class="nav-wordmark" style="font-size: 24px; color: var(--deep); font-weight: 700; letter-spacing: 1px;">
           <img src={%static 'finstella.svg'%} alt="">
        </div>
        {% comment %} <div style="font-size: 10px; letter-spacing: 3px; color: var(--muted); margin-top: 8px; text-transform: uppercase;">
            Finance Leaders Network
        </div> {% endcomment %}
    </div>
    
    <!-- Login Form with Clean White Card Styling -->
    <form method="POST" action="{% url 'login' %}" style="background: #Faf6f2; border: 1px solid rgba(4, 44, 26, 0.08); border-radius: 12px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,0.03);">
        {% csrf_token %}
        
        <!-- Error Messages -->
        {% if messages %}
            {% for message in messages %}
                <div style="background: rgba(224, 62, 62, 0.1); border: 1px solid rgba(224, 62, 62, 0.3); color: var(--danger); font-size: 12px; padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="fl" style="margin-bottom: 16px;">
            <label for="username" style="color: var(--deep); font-weight: 600;">Email</label>
            <input type="text" id="username" name="username" class="inp" autocomplete="username" required style="background: #fff; color: var(--deep); border: 1px solid rgba(4, 44, 26, 0.15);" />
        </div>
        
        <div class="fl" style="margin-bottom: 24px;">
            <label for="password" style="color: var(--deep); font-weight: 600;">Password</label>
            <input type="password" id="password" name="password" class="inp" autocomplete="current-password" required style="background:  #fff; color: var(--deep); border: 1px solid rgba(4, 44, 26, 0.15);" />
        </div>
        
        <button type="submit" class="form-submit" style="background: #199A7A; border: none; transition: transform 0.2s;">Secure Sign In</button>
        
        <div style="margin-top: 24px; text-align: center; border-top: 1px solid rgba(4, 44, 26, 0.08); padding-top: 16px;">
            <p style="font-size: 12px; color: var(--muted);">
                Not a member? <a href="{% url 'apply' %}" style="color: #199A7A; font-weight: 600; text-decoration: none;">Request Access</a>
            </p>
            <a href="{% url 'landing_page' %}" style="display: inline-block; margin-top: 12px; font-size: 11px; color: var(--muted); text-decoration: none; transition: color 0.2s;">
                ← Back to home
            </a>
        </div>
    </form>

</div>
</body>
</html>
