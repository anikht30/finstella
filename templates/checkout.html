{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account — Finstella</title>
    
    <!-- Import Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1E293B;
        }

        .checkout-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid #E2E8F0;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .checkout-header img {
            height: 36px;
            margin-bottom: 20px;
        }

        .checkout-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #199A7A;
        }

        .checkout-header p {
            font-size: 14px;
            color: #64748B;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #199A7A;
        }

        .split-group {
            display: flex;
            gap: 15px;
        }
        
        .split-group .form-group {
            flex: 1;
        }

        .pay-btn {
            width: 100%;
            background-color: #199A7A;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .pay-btn:hover {
            background-color: #128266;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: #94A3B8;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="checkout-header">
            <img src="{% static 'finstella.svg' %}" alt="Finstella Logo">
            <h1>Complete Your Subscription</h1>
            <p>Annual Professional Membership — ₹5000</p>
        </div>

        <!-- Submits to your dummy processor view -->
        <form action="{% url 'process_payment' %}" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Name on Card</label>
                <input type="text" class="form-control" placeholder="Jane Doe" required>
            </div>

            <div class="form-group">
                <label>Card Number</label>
                <!-- For a demo, you can pre-fill dummy text or leave it blank -->
                <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>

            <div class="split-group">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label>CVC</label>
                    <input type="text" class="form-control" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <button type="submit" class="pay-btn">Pay ₹5000 & Activate</button>
            
            <div class="secure-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Secure Demo Environment
            </div>
        </form>
    </div>

</body>
</html>
